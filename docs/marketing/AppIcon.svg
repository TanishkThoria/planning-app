<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Vector twin of the shipping app icon (scripts/make_icon.py): a rounded
       time block on a faint hour grid, crossed by the coral "now" line. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1C26"/>
      <stop offset="1" stop-color="#0C0D12"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="240" x2="0" y2="784" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8191FF"/>
      <stop offset="1" stop-color="#6270E2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.47"/>
    </filter>
  </defs>

  <!-- Full-bleed background (the store / OS applies the rounded-corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Hour grid — faint horizontal hairlines spanning the day column -->
  <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3.6">
    <line x1="164" y1="205" x2="860" y2="205"/>
    <line x1="164" y1="328" x2="860" y2="328"/>
    <line x1="164" y1="451" x2="860" y2="451"/>
    <line x1="164" y1="574" x2="860" y2="574"/>
    <line x1="164" y1="697" x2="860" y2="697"/>
    <line x1="164" y1="820" x2="860" y2="820"/>
  </g>

  <!-- The time block: a bold rounded event card -->
  <g filter="url(#shadow)">
    <rect x="353" y="241" width="318" height="543" rx="89" fill="url(#block)"/>
  </g>
  <rect x="353" y="241" width="318" height="543" rx="89" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>

  <!-- "Content" hint lines, like an event title inside the block -->
  <g fill="#FFFFFF" fill-opacity="0.67">
    <rect x="416" y="349" width="191" height="12" rx="6"/>
    <rect x="416" y="407" width="121" height="12" rx="6"/>
  </g>

  <!-- The "now" line: a coral rule across the column, anchored by a node -->
  <line x1="154" y1="573" x2="870" y2="573" stroke="#FF605C" stroke-width="14" stroke-linecap="round"/>
  <circle cx="154" cy="573" r="27" fill="#FF605C"/>
  <circle cx="154" cy="573" r="9" fill="#FFFFFF" fill-opacity="0.82"/>
</svg>
