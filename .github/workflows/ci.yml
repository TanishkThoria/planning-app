name: CI

# Free on public repositories: standard macOS + Ubuntu GitHub-hosted runners
# have no per-minute billing. Compile-only (no code signing), so no secrets or
# Apple credentials are ever needed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build · iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Xcode version
        run: xcodebuild -version
      - name: Build (iOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Chronos.xcodeproj \
            -scheme Chronos \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  macos:
    name: Build · macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (macOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Chronos.xcodeproj \
            -scheme Chronos \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  core-tests:
    name: Core logic tests · Linux
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Run pure-logic tests
        run: swift test
